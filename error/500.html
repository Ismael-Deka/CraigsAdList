<!DOCTYPE html>

<head>

    <title>500 Internal Server Error</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #333;
            margin: 0;

        }

        .container {
            max-width: 600px;

            font-size: 72px;

            margin: 0;

        p {

            margin: 20px 0;
        }

        .error-icon {
            font-size: 100px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

<body>
    <div class="container">
        <div class="error-icon">🚨</div>
